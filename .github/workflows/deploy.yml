name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: "3.11"
          version: 0.11.32
      - run: uv sync --locked
      - run: uv run --locked ruff check --fix --output-format=github .
      - run: uv run --locked ruff format .
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python scripts/add-story.py --check
      - uses: actions/configure-pages@v6
      - run: uv run --locked python scripts/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
